name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 🔧 Install Dependencies
      run: |
        cd ecommerce/backend && npm ci
        cd ../frontend && npm ci

    - name: 🏗️ Build Frontend
      run: |
        cd ecommerce/frontend
        npm run build

    - name: 🐳 Build and Push Docker Images
      run: |
        # Build backend image
        docker build -t ecommerce-backend:${{ github.sha }} ./ecommerce/backend
        docker build -t ecommerce-frontend:${{ github.sha }} ./ecommerce/frontend
        
        # Tag as latest
        docker tag ecommerce-backend:${{ github.sha }} ecommerce-backend:latest
        docker tag ecommerce-frontend:${{ github.sha }} ecommerce-frontend:latest

    - name: 🚀 Deploy to Render
      run: |
        echo "🚀 Deploying to Render..."
        echo "Backend URL: ${{ secrets.RENDER_BACKEND_URL }}"
        echo "Frontend URL: ${{ secrets.RENDER_FRONTEND_URL }}"
        # Add your Render deployment commands here

    - name: 🏥 Health Check
      run: |
        echo "🏥 Performing health checks..."
        # Add health check commands here
        # curl -f ${{ secrets.RENDER_BACKEND_URL }}/health

    - name: 📧 Notify Success
      if: success()
      run: |
        echo "✅ Deployment successful!"
        echo "Backend: ${{ secrets.RENDER_BACKEND_URL }}"
        echo "Frontend: ${{ secrets.RENDER_FRONTEND_URL }}"

    - name: 📧 Notify Failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for more details."
