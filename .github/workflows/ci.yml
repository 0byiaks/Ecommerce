name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 🔧 Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: 🔧 Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: 🏗️ Build Frontend
      run: |
        cd frontend
        npm run build

    - name: 🐳 Build Docker Images
      run: |
        docker build -t ecommerce-backend:latest ./backend
        docker build -t ecommerce-frontend:latest ./frontend

    - name: ✅ CI Success
      run: |
        echo "🎉 CI/CD Pipeline completed successfully!"
        echo "✅ Dependencies installed"
        echo "✅ Frontend built"
        echo "✅ Docker images created"

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 🚀 Deploy to Render (Backend)
      run: |
        echo "🚀 Deploying backend to Render..."
        echo "📝 Add your Render service URL here"
        echo "🔗 Example: https://ecommerce-backend-kwkg.onrender.com"

    - name: 🚀 Deploy to Render (Frontend)
      run: |
        echo "🚀 Deploying frontend to Render..."
        echo "📝 Add your Render service URL here"
        echo "🔗 Example: https://ecommerce-frontend-172x.onrender.com"

    - name: 🌐 Update Environment Variables
      run: |
        echo "🔧 Update your production environment variables:"
        echo "   - MONGO_URI: Your MongoDB Atlas connection string"
        echo "   - JWT_SECRET: Your production JWT secret"
        echo "   - PORT: 8000 (or your preferred port)"

    - name: ✅ Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "✅ Backend deployed"
        echo "✅ Frontend deployed"
        echo "✅ Environment configured"
        echo ""
        echo "🔗 Your app is now live!"
        echo "📱 Frontend: https://your-frontend.onrender.com"
        echo "🔧 Backend: https://your-backend.onrender.com"
