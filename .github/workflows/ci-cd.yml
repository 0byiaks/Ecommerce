name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend Tests & Build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ecommerce/backend
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ecommerce/backend/package-lock.json

    - name: 🔧 Install Dependencies
      run: npm ci

    - name: 🧪 Run Tests
      run: npm test --if-present

    - name: 🔍 Lint Code
      run: npm run lint --if-present

    - name: 🏗️ Build Application
      run: npm run build --if-present

    - name: 🐳 Build Docker Image
      run: docker build -t ecommerce-backend:${{ github.sha }} .

  # Frontend Tests & Build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ecommerce/frontend
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ecommerce/frontend/package-lock.json

    - name: 🔧 Install Dependencies
      run: npm ci

    - name: 🧪 Run Tests
      run: npm test --if-present

    - name: 🔍 Lint Code
      run: npm run lint --if-present

    - name: 🏗️ Build Application
      run: npm run build

    - name: 🐳 Build Docker Image
      run: docker build -t ecommerce-frontend:${{ github.sha }} .

  # Security Scan
  security:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🔒 Run Security Audit
      run: |
        cd ecommerce/backend && npm audit --audit-level moderate
        cd ../frontend && npm audit --audit-level moderate

    - name: 🛡️ Trivy Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📊 Upload Trivy Results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Backend: ecommerce-backend:${{ github.sha }}"
        echo "Frontend: ecommerce-frontend:${{ github.sha }}"
        # Add your staging deployment commands here

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Backend: ecommerce-backend:${{ github.sha }}"
        echo "Frontend: ecommerce-frontend:${{ github.sha }}"
        # Add your production deployment commands here

    - name: 📧 Notify Deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Database Migration
  database-migration:
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🗄️ Run Database Migrations
      run: |
        echo "🗄️ Running database migrations..."
        # Add your database migration commands here
        # Example: npm run migrate

  # Health Check
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 🏥 Health Check
      run: |
        echo "🏥 Performing health checks..."
        # Add your health check commands here
        # Example: curl -f ${{ secrets.PRODUCTION_URL }}/health
